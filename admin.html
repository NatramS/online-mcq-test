<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>
<body>

<h2>Admin Dashboard</h2>

<button onclick="downloadExcel()">Download Excel</button>
<button onclick="goToLogin()">Back to Login</button>

<div id="results"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  getDocs, 
  deleteDoc, 
  doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAP0AaZOw0fgojRTVwRVf57Dgjm0m9NC-w",
  authDomain: "mcq-assessments.firebaseapp.com",
  projectId: "mcq-assessments",
  storageBucket: "mcq-assessments.firebasestorage.app",
  messagingSenderId: "606020010421",
  appId: "1:606020010421:web:daa6d4701e41f1cc3319fc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let resultsDiv = document.getElementById("results");
let allResults = [];

async function loadResults() {

  resultsDiv.innerHTML = "";
  allResults = [];

  const querySnapshot = await getDocs(collection(db, "results"));

  if (querySnapshot.empty) {
    resultsDiv.innerHTML = "<h3>No results available</h3>";
    return;
  }

  querySnapshot.forEach((documentData) => {

    const r = documentData.data();
    const id = documentData.id;

    allResults.push({ id, ...r });

    resultsDiv.innerHTML += `
      <div style="border:1px solid black; padding:10px; margin:10px;">
        <p><strong>Candidate:</strong> ${r.user}</p>
        <p><strong>Total:</strong> ${r.total}</p>
        <p><strong>Correct:</strong> ${r.correct}</p>
        <p><strong>Wrong:</strong> ${r.wrong}</p>
        <p><strong>Score:</strong> ${r.percentage}%</p>
        <p><strong>Date:</strong> ${r.date}</p>

        <button onclick="deleteResult('${id}')">Delete</button>
      </div>
    `;
  });
}

loadResults();

window.deleteResult = async function(id) {

  let confirmDelete = confirm("Are you sure you want to delete this record?");
  if (!confirmDelete) return;

  try {

    await deleteDoc(doc(db, "results", id));

    alert("Record deleted successfully");

    loadResults(); // refresh list

  } catch (error) {
    console.error(error);
    alert("Error deleting record");
  }
};

window.goToLogin = function () {
  window.location.href = "index.html";
};

window.downloadExcel = function() {

  let csv = "Candidate,Total,Correct,Wrong,Score,Date\n";

  allResults.forEach(r => {
    csv += `${r.user},${r.total},${r.correct},${r.wrong},${r.percentage},${r.date}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let url = window.URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "Assessment_Results.csv";
  a.click();
};

</script>

</body>
</html>
