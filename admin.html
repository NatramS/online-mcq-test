<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    body{
      font-family: Arial;
      margin: 30px;
    }

    .card{
      border:1px solid #ccc;
      padding:15px;
      margin-bottom:15px;
      border-radius:8px;
      background:#f9f9f9;
    }

    button{
      padding:8px 14px;
      margin:5px;
      cursor:pointer;
    }

    .delete{
      background:red;
      color:white;
      border:none;
    }

    .export{
      background:green;
      color:white;
      border:none;
    }

    .back{
      background:#444;
      color:white;
      border:none;
    }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<button class="export" onclick="downloadExcel()">Export Excel</button>
<button class="back" onclick="goToLogin()">Back to Login</button>

<hr>

<div id="results"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAP0AaZOw0fgojRTVwRVf57Dgjm0m9NC-w",
  authDomain: "mcq-assessments.firebaseapp.com",
  projectId: "mcq-assessments",
  storageBucket: "mcq-assessments.firebasestorage.app",
  messagingSenderId: "606020010421",
  appId: "1:606020010421:web:daa6d4701e41f1cc3319fc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let resultsDiv = document.getElementById("results");
let allResults = [];

// Load results
async function loadResults() {

  resultsDiv.innerHTML = "Loading results...";
  allResults = [];

  const querySnapshot = await getDocs(collection(db, "results"));

  if (querySnapshot.empty) {
    resultsDiv.innerHTML = "<h3>No results available</h3>";
    return;
  }

  resultsDiv.innerHTML = "";

  querySnapshot.forEach((docSnap) => {

    const r = docSnap.data();
    const id = docSnap.id;

    allResults.push(r);

    let wrongHTML = "";

    if (r.wrongQuestions && r.wrongQuestions.length > 0) {

      r.wrongQuestions.forEach((q, index) => {

        wrongHTML += `
        <div style="margin-left:15px;">
          <p><strong>Question:</strong> ${q.question}</p>
          <p><strong>Candidate Answer:</strong> ${q.selected}</p>
          <p><strong>Correct Answer:</strong> ${q.correct}</p>
          <hr>
        </div>
        `;
      });

    } else {
      wrongHTML = "<p>All answers correct</p>";
    }

    resultsDiv.innerHTML += `
      <div class="card">
        <p><strong>Candidate:</strong> ${r.user}</p>
        <p><strong>Total:</strong> ${r.total}</p>
        <p><strong>Correct:</strong> ${r.correct}</p>
        <p><strong>Wrong:</strong> ${r.wrong}</p>
        <p><strong>Score:</strong> ${r.percentage}%</p>
        <p><strong>Date:</strong> ${r.date}</p>

        <button class="delete" onclick="deleteResult('${id}')">Delete</button>

        <h4>Incorrect Answers</h4>
        ${wrongHTML}
      </div>
    `;
  });
}

loadResults();

// Delete record
window.deleteResult = async function(id) {

  let confirmDelete = confirm("Are you sure you want to delete this record?");

  if (!confirmDelete) return;

  await deleteDoc(doc(db, "results", id));

  alert("Record deleted successfully");

  loadResults();
};

// Export Excel
window.downloadExcel = function() {

  let csv =
  "Candidate,Total,Correct,Wrong,Score,Date\n";

  allResults.forEach(r => {
    csv += `${r.user},${r.total},${r.correct},${r.wrong},${r.percentage},${r.date}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let url = window.URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "Assessment_Results.csv";
  a.click();
};

// Back to login
window.goToLogin = function() {
  window.location.href = "index.html";
};

</script>

</body>
</html>
